<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* 定义自定义字体 */
        @font-face {
            font-family: 'SaiFont';
            src: url('sai.otf') format('opentype');
        }

        /* 页面整体样式 */
        body {
            font-family: 'SaiFont', sans-serif; /* 使用自定义字体 */
            background-image: url('bg.png'); /* 设置背景图片 */
            background-size: cover; /* 背景图片覆盖整个页面 */
            background-position: center; /* 背景图片居中 */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* 表单容器样式 */
        .form-container {
            background: rgba(255, 255, 255, 0.301); /* 半透明背景 */
            backdrop-filter: blur(20px); /* 高斯模糊效果 */
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 500px;
            text-align: center;
        }

        /* 输入框样式 */
        input[type="text"],
        input[type="password"],
        input[type="email"],
        input[type="button"],
        input[type="submit"] {
            background: rgba(255, 255, 255, 0.301); /* 半透明背景 */
            backdrop-filter: blur(20px); /* 高斯模糊效果 */
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 0px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            text-align: center;
        }

        /* 按钮样式 */
        input[type="button"],
        input[type="submit"] {
            background-color: #718ca85d;
            color: white;
            border: none;
            cursor: pointer;
        }

        input[type="button"]:hover,
        input[type="submit"]:hover {
            background-color: #73869b69;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Novement Games Account</h1>
        <form action="http://110.42.107.223:1128/register.php" method="post">
            Username：<input type="text" name="username" required><br>
            Password：<input type="password" name="password" required><br>
            E-Mail：<input type="email" id="email" name="email"  oninput="validateEmail()"" required><br>
            Verification：<input type="text" name="verification_code" required><br>
            <input type="button" id="sendCodeButton" value="Acquire Verification Code" disabled=true onclick="sendVerificationCode()">
            <input type="submit" value="Register">
        </form>
    </div>
    <script>

    function validateEmail() {
        // 获取邮箱输入框的值
        var email = document.getElementById('email').value;

        // 定义邮箱验证的正则表达式
        var emailPattern = /^[^@]+@[^@]+\.[^@]+$/;

        // 检查邮箱是否符合要求
        if (emailPattern.test(email)) {
            // 如果邮箱合法，启用提交按钮
            document.getElementById('sendCodeButton').disabled = false;
        } else {
            // 如果邮箱不合法，禁用提交按钮
            document.getElementById('sendCodeButton').disabled = true;
        }
    }
        // 发送验证码按钮的冷却时间
        let countdown = 60;
        function startCooldown() {
            const button = document.getElementById('sendCodeButton');
            button.disabled = true;
            button.classList.add('cooldown');
            button.value = `Resend (${countdown}s)`;
            const interval = setInterval(() => {
                countdown--;
                button.value = `Resend (${countdown}s)`;
                if (countdown <= 0) {
                    clearInterval(interval);
                    button.disabled = false;
                    button.classList.remove('cooldown');
                    button.value = 'Acquire Verification Code';
                    countdown = 60;
                }
            }, 1000);
        }

        // 发送验证码的AJAX请求
        function sendVerificationCode() {
            const email = document.getElementById('email').value;
            const username = document.querySelector('input[name="username"]').value; // 获取用户名
            const password = document.querySelector('input[name="password"]').value; // 获取密码
            const formData = new FormData();
            formData.append('send_code', '1');
            formData.append('email', email);
            formData.append('username', username); // 添加用户名到表单数据
            formData.append('password', password); // 添加密码到表单数据

            fetch('register.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.text())
            .then(data => {
                alert(data); // 显示服务器返回的消息
                startCooldown(); // 启动冷却时间
            })
            .catch(error => {
                console.error('Error:', error);
            });
        }
    </script>
</body>
</html>
